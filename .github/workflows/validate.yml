name: Validate TACP v0.1-v0.3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tacp-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      # Fail early if scripts/validate.py is not valid Python.
      # This also catches accidental replacement with YAML or another file type.
      - name: Check validator syntax
        run: python -m py_compile scripts/validate.py

      # Explicit bash + pipefail prevents tee from hiding validator failures.
      - name: Validate v0.1 examples
        run: |
          python scripts/validate.py \
            --examples \
            --version 0.1.0 \
            --json \
            | tee "$RUNNER_TEMP/tacp-0.1.0.json"

      - name: Validate v0.2 examples
        if: ${{ !cancelled() }}
        run: |
          python scripts/validate.py \
            --examples \
            --version 0.2.0 \
            --json \
            | tee "$RUNNER_TEMP/tacp-0.2.0.json"

      # v0.3 example mode also checks the paired synthetic runtime fixtures.
      - name: Validate v0.3 examples and synthetic runtime cases
        if: ${{ !cancelled() }}
        run: |
          python scripts/validate.py \
            --examples \
            --version 0.3.0 \
            --json \
            | tee "$RUNNER_TEMP/tacp-0.3.0.json"

      - name: Check CLI rejection and document-only scope
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          validator = Path("scripts/validate.py").resolve()

          def run_case(arguments, expected_exit, expected_code=None):
              result = subprocess.run(
                  [
                      sys.executable,
                      str(validator),
                      *map(str, arguments),
                      "--json",
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
              )

              if result.returncode != expected_exit:
                  raise SystemExit(
                      f"Unexpected exit {result.returncode}:\n"
                      f"stdout:\n{result.stdout}\n"
                      f"stderr:\n{result.stderr}"
                  )

              report = json.loads(result.stdout)

              if report["mode"] != "files" or len(report["results"]) != 1:
                  raise SystemExit(
                      "Direct file mode must validate exactly the supplied document."
                  )

              row = report["results"][0]

              if row["validation_scope"] != "document_consistency":
                  raise SystemExit(
                      "Synthetic runtime checks leaked into direct file validation."
                  )

              if expected_code:
                  diagnostic_codes = {
                      diagnostic["code"]
                      for diagnostic in row["diagnostics"]
                  }

                  if expected_code not in diagnostic_codes:
                      raise SystemExit(
                          f"Missing intended diagnostic "
                          f"{expected_code}: {row}"
                      )

              if expected_exit == 0 and row["document_valid"] is not True:
                  raise SystemExit(
                      "Expected a document-consistent input."
                  )

          # These negatives depend on independent external state.
          # Their documents alone are consistent; example mode tests
          # their mocked external-state responses.
          for name in (
              "source-edited",
              "hidden-recovery-chain",
              "duplicate-claim-consumption",
          ):
              run_case(
                  [f"examples/v0.3/fail/{name}.json"],
                  0,
              )

          run_case(
              ["examples/v0.3/fail/changed-operation-id.json"],
              1,
              "changed_operation_id",
          )

          run_case(
              [
                  "--version",
                  "0.2.0",
                  "examples/v0.3/pass/mission-completed.json",
              ],
              1,
              "version_mismatch",
          )

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "invalid.json"

              invalid_cases = (
                  (
                      '{"protocol_version":"9.0.0"}',
                      "unsupported_version",
                  ),
                  (
                      '{"protocol_version":"0.3.0",'
                      '"protocol_version":"0.2.0"}',
                      "invalid_json",
                  ),
                  (
                      '{"value":NaN}',
                      "invalid_json",
                  ),
              )

              for text, code in invalid_cases:
                  path.write_text(text, encoding="utf-8")
                  run_case([path], 1, code)

          print(
              "CLI exit codes, intended diagnostics, "
              "and document-only scope verified."
          )
          PY

      - name: Summarize validation scope and results
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          versions = (
              "0.1.0",
              "0.2.0",
              "0.3.0",
          )

          expected_runtime_fixtures = {
              "source-edited.json",
              "hidden-recovery-chain.json",
              "duplicate-claim-consumption.json",
          }

          lines = [
              "## TACP validation",
              "",
              "| Version | Matched | Total | Synthetic runtime cases |",
              "| --- | ---: | ---: | ---: |",
          ]

          failed = False

          for version in versions:
              path = (
                  Path(os.environ["RUNNER_TEMP"])
                  / f"tacp-{version}.json"
              )

              try:
                  report = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  rows = report["results"]

                  runtime = [
                      row
                      for row in rows
                      if row["validation_scope"]
                      == "synthetic_runtime_fixture"
                  ]

                  complete = (
                      report["mode"] == "examples"
                      and report["total"] == len(rows)
                      and len(rows) > 0
                      and report["matched"] == len(rows)
                      and all(row["matched"] for row in rows)
                  )

                  if version == "0.3.0":
                      actual_runtime_fixtures = {
                          Path(row["file"]).name
                          for row in runtime
                      }

                      reject_rows = [
                          row
                          for row in rows
                          if row["expected"] == "reject"
                      ]

                      complete = (
                          complete
                          and actual_runtime_fixtures
                          == expected_runtime_fixtures
                          and all(
                              row["document_valid"] is True
                              for row in runtime
                          )
                          and all(
                              row["expected_code"]
                              for row in reject_rows
                          )
                      )

                  else:
                      complete = complete and not runtime

                  if not complete:
                      failed = True

                  lines.append(
                      f"| {version} "
                      f"| {report['matched']} "
                      f"| {report['total']} "
                      f"| {len(runtime)} |"
                  )

              except (
                  OSError,
                  ValueError,
                  KeyError,
                  TypeError,
              ) as error:
                  failed = True

                  lines.append(
                      f"| {version} "
                      "| unavailable "
                      "| unavailable "
                      "| unavailable |"
                  )

                  print(
                      f"Missing or invalid report "
                      f"for {version}: {error}"
                  )

          lines.extend(
              [
                  "",
                  (
                      "Document checks establish consistency only. "
                      "Synthetic runtime cases include repaired "
                      "positive controls; they do not prove identity, "
                      "evidence authenticity, fencing, revocation, "
                      "or atomic cross-document enforcement."
                  ),
                  (
                      "CLI checks have their own required step."
                  ),
              ]
          )

          summary = "\n".join(lines) + "\n"

          print(summary)

          summary_path = Path(
              os.environ["GITHUB_STEP_SUMMARY"]
          )

          with summary_path.open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(summary)

          if failed:
              raise SystemExit(
                  "Validation reports are incomplete "
                  "or an expectation failed."
              )
          PY
